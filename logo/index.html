<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <title>Dibacii Technologies — Logo Preview</title>
  <link rel="stylesheet" href="css/dibacii-logo.css">
  <style>
    :root { --dibacii-text: #171717; --dibacii-accent: #e40000; --dibacii-accent-ink: #fff; --dibacii-muted: #777; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f7f7; color: #171717; font-family: Arial, sans-serif; }
    .preview { display: grid; justify-items: center; gap: 28px; padding: 48px 24px; }
    .dibacii-logo__mark { width: 120px; height: 120px; padding: 17px; border-radius: 30px; }
    .dibacii-logo__wordmark { font-size: 38px; }
    .dibacii-logo__wordmark small { margin-top: 8px; font-size: 10px; }
    .note { max-width: 440px; margin: 0; color: #777; font-size: 13px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <main class="preview">
    <a class="dibacii-logo" href="#" aria-label="Dibacii Technologies">
      <span class="dibacii-logo__mark" aria-hidden="true">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <path class="dibacii-logo__sail" d="M 68,2 C 68,2 68,485 68,485 C 190,300 370,220 437,247 C 430,170 320,40 68,2 Z" />
          <path class="dibacii-logo__swoosh" d="M 188,456 C 280,410 382,352 382,345 L 382,456 Z" />
        </svg>
      </span>
      <span class="dibacii-logo__wordmark" aria-hidden="true"><span class="dibacii-logo__letter">d</span><span class="dibacii-logo__letter">i</span><span class="dibacii-logo__letter">b</span><span class="dibacii-logo__letter">a</span><span class="dibacii-logo__letter">c</span><span class="dibacii-logo__letter">i</span><span class="dibacii-logo__letter">i</span><span class="dibacii-logo__dot">.</span><small>TECHNOLOGIES</small></span>
    </a>
    <p class="note">A quiet, sculptural mark with a staggered wordmark reveal. The symbol's motion repeats every 30 seconds.</p>
  </main>
</body>
</html>
