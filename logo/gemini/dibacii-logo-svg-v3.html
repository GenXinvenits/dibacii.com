<!-- Dibacii Technologies — Self-Contained Animated Enterprise SVG Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="320" height="320" style="overflow: visible;">
  <style>
    .db-wireframe { transform-origin: 215px 245px; transform-box: view-box; animation: dbWireSnap 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .db-shard     { transform-origin: 215px 245px; transform-box: view-box; animation: dbShardShift 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite -0.4s; }
    .db-chassis   { transform-origin: 215px 245px; transform-box: view-box; animation: dbChassisPulse 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .db-core      { transform-origin: 432px 212px; transform-box: view-box; animation: dbCoreSnap 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .db-orbit-cw  { transform-origin: 432px 212px; transform-box: view-box; animation: dbSpinCW 9s linear infinite; }
    .db-orbit-ccw { transform-origin: 432px 212px; transform-box: view-box; animation: dbSpinCCW 13s linear infinite; }
    .db-hex-pulse { transform-origin: 432px 212px; transform-box: view-box; animation: dbHexOut 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .db-trace-a   { stroke-dasharray: 28 140; animation: dbDataFlow 3.2s linear infinite; }
    .db-trace-b   { stroke-dasharray: 20 160; animation: dbDataFlowRev 3.8s linear infinite; }
    .db-scanner   { animation: dbScan 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate; }
    @keyframes dbWireSnap {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      20% { transform: translate(-11px, -6px) scale(1.035) rotate(-1.5deg); }
      45% { transform: translate(5px, 6px) scale(0.985) rotate(1deg); }
    }
    @keyframes dbShardShift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-6px, 5px) scale(1.02); }
      55% { transform: translate(6px, -5px) scale(0.99); }
    }
    @keyframes dbChassisPulse {
      0%, 100% { transform: scale(1); }
      22% { transform: scale(1.015, 0.99); }
      50% { transform: scale(0.992, 1.01); }
    }
    @keyframes dbCoreSnap {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      18% { transform: translate(12px, -14px) rotate(12deg) scale(1.08); }
      38% { transform: translate(-4px, 8px) rotate(-6deg) scale(0.94); }
      58% { transform: translate(6px, -4px) rotate(4deg) scale(1.03); }
    }
    @keyframes dbSpinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes dbSpinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes dbDataFlow { from { stroke-dashoffset: 168; } to { stroke-dashoffset: 0; } }
    @keyframes dbDataFlowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 180; } }
    @keyframes dbScan { 0% { transform: translateY(-195px); opacity: 0.25; } 50% { opacity: 0.85; } 100% { transform: translateY(215px); opacity: 0.25; } }
    @keyframes dbHexOut { 0% { transform: scale(0.7); opacity: 0.85; } 100% { transform: scale(1.9); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="dbChassisGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#0a2e26" />
      <stop offset="50%" stop-color="#0e473a" />
      <stop offset="100%" stop-color="#07221c" />
    </linearGradient>
    <linearGradient id="dbCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a4" />
      <stop offset="55%" stop-color="#00b87a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="dbScanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e599" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00e599" stop-opacity="0" />
    </linearGradient>
    <pattern id="dbGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#00e599" stroke-width="0.6" stroke-opacity="0.16" />
      <circle cx="0" cy="0" r="1" fill="#00e599" fill-opacity="0.32" />
    </pattern>
    <clipPath id="dbTriClip">
      <path d="M 351 43 C 351 20, 326 11, 307 24 L 33 216 C 17 227, 17 251, 33 263 L 297 472 C 316 487, 340 474, 340 450 Z" />
    </clipPath>
    <filter id="dbSailShadow" x="-18%" y="-18%" width="145%" height="145%">
      <feDropShadow dx="-2" dy="8" stdDeviation="11" flood-color="#020c09" flood-opacity="0.48" />
    </filter>
  </defs>
  <!-- Outer Precision Wireframe -->
  <path class="db-wireframe" opacity="0.65" fill="none" stroke="#00e599" stroke-width="1.5" stroke-dasharray="10 6"
        d="M 351 43 C 351 20, 326 11, 307 24 L 33 216 C 17 227, 17 251, 33 263 L 297 472 C 316 487, 340 474, 340 450 Z" />
  <!-- Mid Structural Shard -->
  <path class="db-shard" opacity="0.85" fill="#0b3b30" stroke="#00b87a" stroke-width="1" stroke-opacity="0.45"
        d="M 351 43 C 351 20, 326 11, 307 24 L 33 216 C 17 227, 17 251, 33 263 L 297 472 C 316 487, 340 474, 340 450 Z" />
  <!-- Main Tech Chassis + Circuits -->
  <g class="db-chassis">
    <path fill="url(#dbChassisGrad)" stroke="#00e599" stroke-width="1.4" stroke-opacity="0.55"
          d="M 351 43 C 351 20, 326 11, 307 24 L 33 216 C 17 227, 17 251, 33 263 L 297 472 C 316 487, 340 474, 340 450 Z" />
    <g clip-path="url(#dbTriClip)">
      <rect x="0" y="0" width="380" height="500" fill="url(#dbGrid)" />
      <path d="M 48 238 L 96 238 L 122 212 L 335 212" fill="none" stroke="#00b87a" stroke-width="1.2" stroke-opacity="0.28" />
      <path d="M 75 268 L 118 268 L 146 296 L 335 296" fill="none" stroke="#00b87a" stroke-width="1.2" stroke-opacity="0.28" />
      <path class="db-trace-a" d="M 48 238 L 96 238 L 122 212 L 335 212" fill="none" stroke="#00e599" stroke-width="2.2" />
      <path class="db-trace-b" d="M 75 268 L 118 268 L 146 296 L 335 296" fill="none" stroke="#00e599" stroke-width="2" />
      <circle cx="48" cy="238" r="3" fill="#00e599" />
      <circle cx="75" cy="268" r="3" fill="#00e599" />
      <rect class="db-scanner" x="0" y="210" width="380" height="44" fill="url(#dbScanGrad)" />
    </g>
  </g>
  <!-- Quantum Innovation Node -->
  <polygon class="db-hex-pulse" points="432,158 479,185 479,239 432,266 385,239 385,185" fill="none" stroke="#00e599" stroke-width="2" />
  <g class="db-orbit-ccw">
    <circle cx="432" cy="212" r="64" fill="none" stroke="#00b87a" stroke-width="1.2" stroke-dasharray="6 10 24 10" stroke-opacity="0.65" />
    <circle cx="496" cy="212" r="3" fill="#00e599" />
  </g>
  <g class="db-orbit-cw">
    <circle cx="432" cy="212" r="52" fill="none" stroke="#00e599" stroke-width="1.4" stroke-dasharray="32 18" stroke-opacity="0.75" />
    <circle cx="432" cy="160" r="3.5" fill="#00e599" />
  </g>
  <g class="db-core">
    <path fill="url(#dbCoreGrad)" stroke="#00f5a4" stroke-width="1.5"
          d="M 405 159 C 386 158, 375 178, 384 196 L 415 256 C 425 275, 452 274, 460 255 L 484 198 C 492 180, 479 162, 460 161 Z" />
    <circle cx="434" cy="198" r="3.5" fill="#ffffff" fill-opacity="0.85" />
  </g>
  <!-- Intact & Stationary White Sail Geometry -->
  <g filter="url(#dbSailShadow)">
    <path d="M 124 66 C 265 68, 362 142, 386 244 C 316 210, 200 264, 125 426 C 118 296, 119 180, 124 66 Z" fill="#ffffff" />
    <path d="M 344 322 C 310 364, 260 390, 207 401 L 346 401 Z" fill="#ffffff" />
  </g>
</svg>
